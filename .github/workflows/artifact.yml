name: Use Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Upload project source
        uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: |
            index.js
            index.test.js
            package.json
            package-lock.json

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download project artifact
        uses: actions/download-artifact@v4
        with:
          name: project-source
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test